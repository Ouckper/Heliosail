<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>光帆飞船 · 太阳系逃逸模拟</title>
<style>
  :root {
    --bg: #05060a;
    --panel: rgba(12, 15, 24, 0.84);
    --border: rgba(110, 160, 255, 0.16);
    --text: #dde3f0;
    --dim: #78859e;
    --accent: #5eb0ff;
    --good: #4ade80;
    --warn: #fbbf24;
    --bad: #f87171;
    --line: rgba(110, 160, 255, 0.12);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }

  .panel {
    position: fixed;
    background: var(--panel);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }

  #controls {
    top: 16px; left: 16px; width: 300px;
    max-height: calc(100vh - 32px); overflow-y: auto;
  }
  #readout { top: 16px; right: 16px; width: 224px; }

  .title {
    font-size: 14px; font-weight: 600; letter-spacing: .3px;
    display: flex; align-items: center; gap: 8px; margin-bottom: 14px;
  }
  .title .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 10px var(--accent);
  }

  .field { margin-bottom: 13px; }
  .field-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 6px;
  }
  .field-label { color: var(--dim); font-size: 11.5px; letter-spacing: .2px; }
  .field-val { color: var(--text); font-size: 12px; font-variant-numeric: tabular-nums; font-weight: 500; }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 3px; border-radius: 2px;
    background: rgba(110,160,255,0.18); outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 13px; height: 13px; border-radius: 50%;
    background: var(--accent); border: 2px solid #0b0e17;
    box-shadow: 0 0 8px rgba(94,176,255,0.6);
    cursor: pointer; transition: transform .12s;
  }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.18); }
  input[type=range]::-moz-range-thumb {
    width: 13px; height: 13px; border-radius: 50%;
    background: var(--accent); border: 2px solid #0b0e17; cursor: pointer;
  }

  .btn-row { display: flex; gap: 8px; margin-top: 16px; }
  button {
    flex: 1; padding: 9px 0; border-radius: 9px;
    border: 1px solid var(--border); background: rgba(94,176,255,0.09);
    color: var(--text); font-size: 12.5px; font-weight: 500;
    cursor: pointer; transition: all .15s; font-family: inherit;
  }
  button:hover { background: rgba(94,176,255,0.2); border-color: rgba(94,176,255,0.4); }
  button:active { transform: scale(0.97); }
  button.primary { background: rgba(94,176,255,0.22); border-color: rgba(94,176,255,0.45); }

  .row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 5px 0; font-size: 12px;
  }
  .row + .row { border-top: 1px solid rgba(110,160,255,0.07); }
  .row .k { color: var(--dim); }
  .row .v { font-variant-numeric: tabular-nums; font-weight: 500; letter-spacing: .2px; }

  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 20px;
    font-size: 10.5px; font-weight: 600; letter-spacing: .4px;
  }
  .badge.bound { background: rgba(248,113,113,0.14); color: var(--bad); }
  .badge.escape { background: rgba(74,222,128,0.14); color: var(--good); }

  .hr { height: 1px; background: var(--line); margin: 12px 0; }

  .hint { color: var(--dim); font-size: 10.5px; line-height: 1.6; margin-top: 10px; }

  .toast {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%) scale(0.9);
    background: rgba(12,15,24,0.94); border: 1px solid rgba(94,176,255,0.4);
    border-radius: 14px; padding: 18px 34px; text-align: center;
    font-size: 17px; font-weight: 600; letter-spacing: 1px;
    pointer-events: none; opacity: 0; transition: opacity .5s, transform .5s;
    box-shadow: 0 0 60px rgba(94,176,255,0.28);
  }
  .toast.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  .toast small { display: block; font-size: 11px; font-weight: 400; color: var(--dim); margin-top: 6px; letter-spacing: 0; }

  @media (max-width: 820px) {
    #controls { width: calc(100vw - 32px); max-height: 42vh; }
    #readout { top: auto; bottom: 16px; right: 16px; left: 16px; width: auto; }
    #readout .row { font-size: 11px; }
  }
</style>
</head>
<body>

<canvas id="cv"></canvas>

<div id="controls" class="panel">
  <div class="title"><span class="dot"></span>光帆飞船 · 逃逸模拟</div>

  <div class="field">
    <div class="field-head">
      <span class="field-label">飞船质量</span>
      <span class="field-val" id="vMass">0.100 kg</span>
    </div>
    <input type="range" id="sMass" min="0" max="1000" value="500">
  </div>

  <div class="field">
    <div class="field-head">
      <span class="field-label">光帆面积</span>
      <span class="field-val" id="vArea">200 m²</span>
    </div>
    <input type="range" id="sArea" min="0" max="1000" value="693">
  </div>

  <div class="field">
    <div class="field-head">
      <span class="field-label">帆面倾角</span>
      <span class="field-val" id="vTilt">0°</span>
    </div>
    <input type="range" id="sTilt" min="0" max="60" value="0">
  </div>

  <div class="field">
    <div class="field-head">
      <span class="field-label">时间速度</span>
      <span class="field-val" id="vSpeed">20 天/帧</span>
    </div>
    <input type="range" id="sSpeed" min="0" max="1000" value="430">
  </div>

  <div class="btn-row">
    <button id="btnPlay" class="primary">发射</button>
    <button id="btnReset">重置</button>
  </div>

  <div class="hint">
    面质比 A/m 决定一切。临界值 ≈ 654 m²/kg —— 超过它，光压净推力就大于太阳引力。<br>
    空格键 播放/暂停 · R 键 重置
  </div>
</div>

<div id="readout" class="panel">
  <div class="row"><span class="k">任务时间</span><span class="v" id="rTime">0.0 天</span></div>
  <div class="row"><span class="k">距太阳</span><span class="v" id="rDist">1.000 AU</span></div>
  <div class="row"><span class="k">速度</span><span class="v" id="rVel">29.8 km/s</span></div>
  <div class="row"><span class="k">面质比</span><span class="v" id="rAm">2000 m²/kg</span></div>
  <div class="row"><span class="k">光压/引力</span><span class="v" id="rRatio">3.06×</span></div>
  <div class="hr"></div>
  <div class="row"><span class="k">比机械能</span><span class="v" id="rEnergy">—</span></div>
  <div class="row"><span class="k">状态</span><span class="v"><span id="rState" class="badge bound">束缚轨道</span></span></div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* ══════════════════════════════════════════
   物理常量
   单位：AU（天文单位）、day（天）
   ══════════════════════════════════════════ */
const GM      = 2.959122082855911e-4;  // 太阳引力常数 AU³/day²
const K_RAD   = 4.5265e-7;             // 1 AU 处光压加速度系数（每 m²/kg）
const AU_KM   = 1.495978707e8;         // km
const AU_DAY_KM_S = AU_KM / 86400;     // 1 AU/day = 1731.46 km/s
const AM_CRIT = GM / K_RAD;            // ≈ 653.7 m²/kg

/* ══════════════════════════════════════════
   状态
   ══════════════════════════════════════════ */
const P = {
  mass: 0.1,       // kg
  area: 200,       // m²
  tilt: 0,         // 度
  speed: 20,       // 天/帧
  running: false,
};

const sim = {
  x: 1, y: 0, vx: 0, vy: 0, t: 0,
  trail: [],
  escaped: false,
  milestone: 0,     // 已播报的里程碑索引
};

let viewRadius = 1.7;
let viewTarget = 1.7;
let stars = [];
let W = 0, H = 0, DPR = 1;
let ca = 1, sa = 0;   // cos/sin of tilt

const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');

/* ══════════════════════════════════════════
   轨道数据（AU）
   ══════════════════════════════════════════ */
const ORBITS = [
  { r: 0.387, name: '水星',  color: 'rgba(150,150,165,0.22)' },
  { r: 0.723, name: '金星',  color: 'rgba(200,170,120,0.22)' },
  { r: 1.000, name: '地球',  color: 'rgba(100,170,255,0.40)' },
  { r: 1.524, name: '火星',  color: 'rgba(220,120,90,0.25)'  },
  { r: 5.203, name: '木星',  color: 'rgba(210,180,140,0.22)' },
  { r: 9.537, name: '土星',  color: 'rgba(200,190,150,0.20)' },
  { r: 19.19, name: '天王星', color: 'rgba(140,210,220,0.20)' },
  { r: 30.07, name: '海王星', color: 'rgba(110,150,230,0.20)' },
];

const MILESTONES = [
  { r: 1.52,  label: '穿越火星轨道', sub: '1.52 AU' },
  { r: 5.20,  label: '穿越木星轨道', sub: '5.20 AU' },
  { r: 30.07, label: '穿越海王星轨道', sub: '30.07 AU · 行星际空间尽头' },
  { r: 120,   label: '穿越日球层顶', sub: '120 AU · 正式进入星际空间' },
  { r: 500,   label: '深入星际空间', sub: '500 AU · 奥尔特云内缘' },
];

/* ══════════════════════════════════════════
   物理：加速度
   ══════════════════════════════════════════ */
function accel(x, y, vx, vy) {
  const r2 = x * x + y * y;
  const r = Math.sqrt(r2);
  const rx = x / r, ry = y / r;

  // 太阳引力
  const ag = -GM / r2;
  let ax = ag * rx;
  let ay = ag * ry;

  // 光压：帆面法线方向
  const am = K_RAD * (P.area / P.mass) / r2;

  // 切向单位向量（沿运动方向）
  let tx = -ry, ty = rx;
  if (vx * tx + vy * ty < 0) { tx = -tx; ty = -ty; }

  // 帆法线 = cosα·r̂ + sinα·t̂
  const nx = ca * rx + sa * tx;
  const ny = ca * ry + sa * ty;

  // 推力大小 ∝ cos²α，方向沿法线
  const f = am * ca * ca;
  ax += f * nx;
  ay += f * ny;

  return [ax, ay];
}

/* ── RK4 积分 ── */
function deriv(x, y, vx, vy) {
  const [ax, ay] = accel(x, y, vx, vy);
  return [vx, vy, ax, ay];
}

function rk4Step(dt) {
  const s = sim;
  const k1 = deriv(s.x, s.y, s.vx, s.vy);

  const k2 = deriv(
    s.x + k1[0] * dt * 0.5, s.y + k1[1] * dt * 0.5,
    s.vx + k1[2] * dt * 0.5, s.vy + k1[3] * dt * 0.5
  );
  const k3 = deriv(
    s.x + k2[0] * dt * 0.5, s.y + k2[1] * dt * 0.5,
    s.vx + k2[2] * dt * 0.5, s.vy + k2[3] * dt * 0.5
  );
  const k4 = deriv(
    s.x + k3[0] * dt, s.y + k3[1] * dt,
    s.vx + k3[2] * dt, s.vy + k3[3] * dt
  );

  const d6 = dt / 6;
  s.x  += d6 * (k1[0] + 2 * k2[0] + 2 * k3[0] + k4[0]);
  s.y  += d6 * (k1[1] + 2 * k2[1] + 2 * k3[1] + k4[1]);
  s.vx += d6 * (k1[2] + 2 * k2[2] + 2 * k3[2] + k4[2]);
  s.vy += d6 * (k1[3] + 2 * k2[3] + 2 * k3[3] + k4[3]);
  s.t  += dt;
}

/* ══════════════════════════════════════════
   主更新
   ══════════════════════════════════════════ */
function update() {
  if (!P.running) return;

  const daysPerFrame = P.speed;
  const MAX_STEPS = 2600;
  let steps = Math.max(1, Math.ceil(daysPerFrame / 0.05));
  steps = Math.min(steps, MAX_STEPS);
  const dt = daysPerFrame / steps;

  for (let i = 0; i < steps; i++) {
    rk4Step(dt);

    // 安全阀
    const r2 = sim.x * sim.x + sim.y * sim.y;
    if (r2 > 1e8) { sim.x *= 0.1; sim.y *= 0.1; }
    if (!isFinite(sim.x) || !isFinite(sim.y)) { resetSim(); return; }
  }

  // 记录轨迹
  const r = Math.hypot(sim.x, sim.y);
  const last = sim.trail[sim.trail.length - 1];
  if (!last || Math.hypot(sim.x - last[0], sim.y - last[1]) > viewRadius / 280) {
    sim.trail.push([sim.x, sim.y]);
    if (sim.trail.length > 4000) sim.trail.shift();
  }

  // 里程碑
  if (sim.milestone < MILESTONES.length && r >= MILESTONES[sim.milestone].r) {
    const m = MILESTONES[sim.milestone];
    showToast(m.label, m.sub);
    sim.milestone++;
  }

  // 逃逸判定
  const v2 = sim.vx * sim.vx + sim.vy * sim.vy;
  const E = 0.5 * v2 - GM / r;
  if (E > 0 && !sim.escaped) {
    sim.escaped = true;
    showToast('已脱离太阳引力束缚', '双曲逃逸轨道 · 飞船将一去不返');
  }
}

/* ══════════════════════════════════════════
   渲染
   ══════════════════════════════════════════ */
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  makeStars();
}

function makeStars() {
  stars = [];
  const n = Math.floor((W * H) / 5200);
  for (let i = 0; i < n; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.15 + 0.18,
      a: Math.random() * 0.55 + 0.12,
    });
  }
}

function render() {
  // 背景
  const bg = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.72);
  bg.addColorStop(0, '#0a0c16');
  bg.addColorStop(1, '#030408');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // 星空
  for (const s of stars) {
    ctx.fillStyle = `rgba(255,255,255,${s.a})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, 6.2832);
    ctx.fill();
  }

  const cx = W / 2, cy = H / 2;

  // 视野平滑跟随
  const rNow = Math.hypot(sim.x, sim.y);
  viewTarget = Math.max(1.7, rNow * 1.28);
  viewRadius += (viewTarget - viewRadius) * 0.045;

  const scale = Math.min(W, H) * 0.44 / viewRadius;
  const toS = (wx, wy) => [cx + wx * scale, cy - wy * scale];

  /* ── 行星轨道 ── */
  for (const o of ORBITS) {
    const pr = o.r * scale;
    if (pr < 3 || pr > Math.max(W, H) * 3) continue;
    ctx.strokeStyle = o.color;
    ctx.lineWidth = o.r === 1.0 ? 1.4 : 1;
    ctx.beginPath();
    ctx.arc(cx, cy, pr, 0, 6.2832);
    ctx.stroke();

    // 标签
    if (pr > 26 && pr < Math.max(W, H) * 0.55) {
      ctx.fillStyle = 'rgba(140,160,195,0.5)';
      ctx.font = '10px -apple-system, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(o.name, cx + pr + 5, cy - 3);
    }
  }

  /* ── 太阳 ── */
  const sunR = Math.max(4.5, Math.min(16, 0.018 * scale));
  const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, sunR * 9);
  glow.addColorStop(0, 'rgba(255,230,150,0.5)');
  glow.addColorStop(0.18, 'rgba(255,180,60,0.16)');
  glow.addColorStop(1, 'rgba(255,150,40,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(cx, cy, sunR * 9, 0, 6.2832);
  ctx.fill();

  const sunCore = ctx.createRadialGradient(cx, cy, 0, cx, cy, sunR);
  sunCore.addColorStop(0, '#fffbe8');
  sunCore.addColorStop(0.55, '#ffd86a');
  sunCore.addColorStop(1, '#ff9c1a');
  ctx.fillStyle = sunCore;
  ctx.beginPath();
  ctx.arc(cx, cy, sunR, 0, 6.2832);
  ctx.fill();

  /* ── 地球位置（随时间公转） ── */
  const earthAng = (sim.t / 365.256) * 6.2832;
  const [ex, ey] = toS(Math.cos(earthAng), Math.sin(earthAng));
  if (Math.hypot(ex - cx, ey - cy) > 4) {
    ctx.fillStyle = 'rgba(120,190,255,0.85)';
    ctx.beginPath();
    ctx.arc(ex, ey, 2.6, 0, 6.2832);
    ctx.fill();
  }

  /* ── 轨迹 ── */
  if (sim.trail.length > 1) {
    ctx.lineWidth = 1.6;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    // 分段渐变：越新越亮
    const N = sim.trail.length;
    const CHUNK = 60;
    for (let i = 1; i < N; i += CHUNK) {
      const j = Math.min(i + CHUNK, N);
      const alpha = 0.06 + 0.72 * (i / N);
      ctx.strokeStyle = `rgba(94,176,255,${alpha})`;
      ctx.beginPath();
      let p = toS(sim.trail[i - 1][0], sim.trail[i - 1][1]);
      ctx.moveTo(p[0], p[1]);
      for (let k = i; k < j; k++) {
        p = toS(sim.trail[k][0], sim.trail[k][1]);
        ctx.lineTo(p[0], p[1]);
      }
      ctx.stroke();
    }
  }

  /* ── 飞船 ── */
  const [sx, sy] = toS(sim.x, sim.y);
  if (isFinite(sx) && isFinite(sy)) {
    // 光晕
    const g2 = ctx.createRadialGradient(sx, sy, 0, sx, sy, 14);
    g2.addColorStop(0, 'rgba(120,220,255,0.75)');
    g2.addColorStop(0.35, 'rgba(94,176,255,0.28)');
    g2.addColorStop(1, 'rgba(94,176,255,0)');
    ctx.fillStyle = g2;
    ctx.beginPath();
    ctx.arc(sx, sy, 14, 0, 6.2832);
    ctx.fill();

    // 核心
    ctx.fillStyle = '#eaf6ff';
    ctx.beginPath();
    ctx.arc(sx, sy, 2.8, 0, 6.2832);
    ctx.fill();

    // 光帆示意（朝向太阳的细线）
    const dx = cx - sx, dy = cy - sy;
    const dl = Math.hypot(dx, dy) || 1;
    const sailLen = Math.min(18, 6 + 0.006 * scale);
    ctx.strokeStyle = 'rgba(140,220,255,0.6)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(sx - dx / dl * sailLen * 0.3, sy - dy / dl * sailLen * 0.3);
    ctx.lineTo(sx - dx / dl * sailLen * 1.3, sy - dy / dl * sailLen * 1.3);
    ctx.stroke();

    // 速度矢量
    const vlen = Math.hypot(sim.vx, sim.vy);
    if (vlen > 1e-6 && viewRadius < 60) {
      const vScale = Math.min(60, 420 / viewRadius);
      const ux = sim.vx / vlen, uy = sim.vy / vlen;
      const vxEnd = sx + ux * vScale;
      const vyEnd = sy - uy * vScale;
      ctx.strokeStyle = 'rgba(74,222,128,0.55)';
      ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(vxEnd, vyEnd);
      ctx.stroke();
      // 箭头
      const a = Math.atan2(-uy, ux);
      ctx.beginPath();
      ctx.moveTo(vxEnd, vyEnd);
      ctx.lineTo(vxEnd - 6 * Math.cos(a - 0.4), vyEnd - 6 * Math.sin(a - 0.4));
      ctx.lineTo(vxEnd - 6 * Math.cos(a + 0.4), vyEnd - 6 * Math.sin(a + 0.4));
      ctx.closePath();
      ctx.fillStyle = 'rgba(74,222,128,0.55)';
      ctx.fill();
    }
  }

  /* ── 比例尺 ── */
  drawScaleBar(scale);
}

function drawScaleBar(scale) {
  // 选一个漂亮的 1-2-5 刻度
  const targets = [0.01,0.02,0.05,0.1,0.2,0.5,1,2,5,10,20,50,100,200,500,1000,2000,5000];
  const wantPx = Math.min(W, H) * 0.22;
  let unit = targets[0];
  for (const t of targets) {
    if (t * scale <= wantPx) unit = t;
  }
  const px = unit * scale;
  if (px < 20) return;

  const x0 = 24;
  const y0 = H - 34;

  ctx.strokeStyle = 'rgba(160,180,215,0.42)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x0, y0 - 5); ctx.lineTo(x0, y0 + 5);
  ctx.moveTo(x0 + px, y0 - 5); ctx.lineTo(x0 + px, y0 + 5);
  ctx.moveTo(x0, y0); ctx.lineTo(x0 + px, y0);
  ctx.stroke();

  ctx.fillStyle = 'rgba(160,180,215,0.65)';
  ctx.font = '11px -apple-system, sans-serif';
  ctx.textAlign = 'left';
  const label = unit >= 1 ? `${unit} AU` : `${unit} AU`;
  ctx.fillText(label, x0, y0 - 10);
}

/* ══════════════════════════════════════════
   UI 绑定
   ══════════════════════════════════════════ */
const el = id => document.getElementById(id);

// 对数映射：滑块 0..1000 → min..max
function logMap(v, min, max) {
  return min * Math.pow(max / min, v / 1000);
}
function logInv(val, min, max) {
  return 1000 * Math.log(val / min) / Math.log(max / min);
}

function syncParams() {
  P.mass = logMap(+el('sMass').value, 0.001, 50);
  P.area = logMap(+el('sArea').value, 0.5, 5000);
  P.tilt = +el('sTilt').value;
  P.speed = logMap(+el('sSpeed').value, 0.2, 100);

  ca = Math.cos(P.tilt * Math.PI / 180);
  sa = Math.sin(P.tilt * Math.PI / 180);

  el('vMass').textContent = P.mass < 1
    ? `${(P.mass * 1000).toFixed(P.mass < 0.01 ? 2 : 1)} g`
    : `${P.mass.toFixed(2)} kg`;
  el('vArea').textContent = P.area < 10
    ? `${P.area.toFixed(2)} m²`
    : `${P.area.toFixed(0)} m²`;
  el('vTilt').textContent = `${P.tilt}°`;
  el('vSpeed').textContent = P.speed < 10
    ? `${P.speed.toFixed(1)} 天/帧`
    : `${P.speed.toFixed(0)} 天/帧`;
}

['sMass', 'sArea', 'sTilt', 'sSpeed'].forEach(id => {
  el(id).addEventListener('input', syncParams);
});

function fmtTime(days) {
  if (days < 1000) return `${days.toFixed(1)} 天`;
  const y = days / 365.256;
  if (y < 1000) return `${y.toFixed(2)} 年`;
  return `${(y / 1000).toFixed(2)} 千年`;
}

function updateReadout() {
  const r = Math.hypot(sim.x, sim.y);
  const v = Math.hypot(sim.vx, sim.vy);
  const am = P.area / P.mass;

  el('rTime').textContent = fmtTime(sim.t);
  el('rDist').textContent = r < 100 ? `${r.toFixed(3)} AU` : `${r.toFixed(1)} AU`;
  el('rVel').textContent = `${(v * AU_DAY_KM_S).toFixed(2)} km/s`;
  el('rAm').textContent = am < 100 ? `${am.toFixed(1)} m²/kg` : `${am.toFixed(0)} m²/kg`;

  const aRad = K_RAD * am * ca * ca / (r * r);
  const aGrav = GM / (r * r);
  const ratio = aRad / aGrav;
  const ratioEl = el('rRatio');
  ratioEl.textContent = `${ratio.toFixed(2)}×`;
  ratioEl.style.color = ratio > 1 ? 'var(--good)' : ratio > 0.5 ? 'var(--warn)' : 'var(--text)';

  const E = 0.5 * v * v - GM / r;
  el('rEnergy').textContent = (E > 0 ? '+' : '') + E.toExponential(2);

  const st = el('rState');
  if (E > 0) {
    st.className = 'badge escape';
    st.textContent = '逃逸轨道';
  } else {
    st.className = 'badge bound';
    st.textContent = '束缚轨道';
  }
}

/* ── Toast ── */
let toastTimer = null;
function showToast(title, sub) {
  const t = el('toast');
  t.innerHTML = `${title}${sub ? `<small>${sub}</small>` : ''}`;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ── 控制 ── */
function resetSim() {
  sim.x = 1; sim.y = 0;
  sim.vx = 0; sim.vy = Math.sqrt(GM / 1);
  sim.t = 0;
  sim.trail = [[1, 0]];
  sim.escaped = false;
  sim.milestone = 0;
  viewRadius = 1.7;
  viewTarget = 1.7;
  el('btnPlay').textContent = '发射';
  el('btnPlay').classList.add('primary');
  P.running = false;
  updateReadout();
}

function togglePlay() {
  P.running = !P.running;
  el('btnPlay').textContent = P.running ? '暂停' : '继续';
  if (P.running) el('btnPlay').classList.remove('primary');
  else el('btnPlay').classList.add('primary');
}

el('btnPlay').addEventListener('click', togglePlay);
el('btnReset').addEventListener('click', () => { resetSim(); });

window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.key === 'r' || e.key === 'R') resetSim();
});

window.addEventListener('resize', resize);

/* ══════════════════════════════════════════
   主循环
   ══════════════════════════════════════════ */
function loop() {
  update();
  render();
  updateReadout();
  requestAnimationFrame(loop);
}

/* ══════════════════════════════════════════
   初始化
   ══════════════════════════════════════════ */
function init() {
  resize();

  // 默认参数：0.1 kg / 200 m²  →  A/m = 2000
  el('sMass').value = Math.round(logInv(0.1, 0.001, 50));
  el('sArea').value = Math.round(logInv(200, 0.5, 5000));
  el('sTilt').value = 0;
  el('sSpeed').value = Math.round(logInv(20, 0.2, 100));

  syncParams();
  resetSim();
  loop();
}

init();
</script>
